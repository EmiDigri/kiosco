<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo efectos botón</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;font-family:'Inter',system-ui,sans-serif;padding:24px;color:#fff}
h1{font-size:16px;font-weight:600;margin-bottom:20px;color:#aaa}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:#1a1d27;border:1px solid #2a2d3a;border-radius:14px;padding:14px;cursor:pointer}
.card:hover{border-color:#3D5AFE}
.card-label{font-size:11px;color:#666;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-label span{background:#252836;border-radius:4px;padding:1px 6px;color:#555}
.stage{width:100%;height:60px;border-radius:8px;background:#12141c;position:relative;display:flex;align-items:center;justify-content:center}
.stage canvas{position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:8px}
.btn{width:calc(100% - 16px);height:40px;border:none;border-radius:8px;background:#3D5AFE;color:#fff;font-size:12px;font-weight:600;cursor:pointer;position:relative;z-index:2;transition:background .3s}
.card-desc{font-size:10px;color:#444;text-align:center;margin-top:8px}
</style>
</head>
<body>
<h1>Click en cualquier tarjeta — 1.8s loading → éxito</h1>
<div class="grid" id="grid"></div>
<script>
const efectos=[
{n:'Partículas',desc:'escala suave → puntos explotan',
 l(b){b._t=setInterval(()=>{b.style.transform=`scale(${.97+Math.random()*.06})`;},120);},
 le(b){clearInterval(b._t);b.style.transform='';},
 x(b,c){const ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=c.offsetHeight;const cx=c.width/2,cy=c.height/2;const cols=['#22c55e','#4ade80','#fff','#6B7FFF','#facc15','#f472b6','#34d399'];const ps=Array.from({length:28},(_,i)=>{const a=(i/28)*Math.PI*2,sp=2+Math.random()*3;return{x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3+Math.random()*5,c:cols[i%cols.length],a:1};});let f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.a-=.013;p.r*=.987;if(p.a>0){alive=true;ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();}});ctx.globalAlpha=1;if(alive&&f++<80)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Neon',desc:'arcoíris en borde → flash verde',
 l(b){let h=0;b._t=setInterval(()=>{h=(h+12)%360;b.style.boxShadow=`0 0 10px 3px hsl(${h},100%,60%)`;},50);},
 le(b){clearInterval(b._t);b.style.boxShadow='';},
 x(b){b.style.transition='box-shadow .06s';b.style.boxShadow='0 0 0 3px #fff,0 0 30px 10px rgba(255,255,255,.5)';setTimeout(()=>{b.style.boxShadow='0 0 0 2px #22c55e,0 0 20px 8px rgba(34,197,94,.4)';setTimeout(()=>{b.style.boxShadow='';b.style.transition='';},700);},180);}
},
{n:'Glitch',desc:'tiembla + hue random → flash blanco',
 l(b){b._t=setInterval(()=>{const dx=(Math.random()-.5)*8,dy=(Math.random()-.5)*4;b.style.transform=`translate(${dx}px,${dy}px)`;b.style.filter=Math.random()>.65?`hue-rotate(${Math.random()*360}deg)saturate(4)`:'';},65);},
 le(b){clearInterval(b._t);b.style.transform='';b.style.filter='';},
 x(b){b.style.filter='brightness(5)';setTimeout(()=>{b.style.filter='';},180);}
},
{n:'Líquido',desc:'fill azul sube → salpicadura',
 l(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');let h=0,run=true;b._lrun=()=>run=false;(function d(){if(!run)return;h=Math.min(h+1,c.height);ctx.clearRect(0,0,c.width,c.height);ctx.globalAlpha=.35;ctx.fillStyle='#60a5fa';ctx.fillRect(0,c.height-h,c.width,h);ctx.globalAlpha=1;requestAnimationFrame(d);})();},
 le(b,c){if(b._lrun)b._lrun();setTimeout(()=>{c.getContext('2d').clearRect(0,0,c.width,c.height);},60);},
 x(b,c){const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2;ctx.clearRect(0,0,c.width,c.height);const ps=Array.from({length:22},(_,i)=>{const a=(i/22)*Math.PI*2;return{x:cx,y:cy,vx:Math.cos(a)*(2+Math.random()*2.5),vy:Math.sin(a)*(2+Math.random()*2.5)-.8,r:2+Math.random()*4,a:1};});let f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.a-=.016;if(p.a>0){alive=true;ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#60a5fa';ctx.fill();}});ctx.globalAlpha=1;if(alive&&f++<70)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Matrix',desc:'chars japoneses caen → cascada verde',
 l(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const cols=Math.floor(c.width/9),drops=Array.from({length:cols},()=>Math.random()*4);b._mt=setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='rgba(0,255,70,.9)';ctx.font='9px monospace';drops.forEach((y,i)=>{ctx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*9,y*9);if(y*9>c.height&&Math.random()>.92)drops[i]=0;else drops[i]+=.7;});},55);},
 le(b,c){clearInterval(b._mt);c.getContext('2d').clearRect(0,0,c.width,c.height);},
 x(b,c){const ctx=c.getContext('2d');const nc=Math.floor(c.width/9);let f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);const p=f/45;for(let i=0;i<nc;i++){const x=i*9;const len=c.height*p;ctx.fillStyle=`rgba(0,255,70,${.9-p*.6})`;ctx.font='9px monospace';for(let j=0;j<Math.floor(len/9);j++)ctx.fillText(String.fromCharCode(0x30A0+Math.random()*96),x,j*9);}if(f++<45)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Fuego',desc:'llamas naranja suben → explosión ígnea',
 l(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const ps=[];b._ft=setInterval(()=>{for(let i=0;i<4;i++)ps.push({x:Math.random()*c.width,y:c.height,vx:(Math.random()-.5)*1.5,vy:-(1.2+Math.random()*2.5),r:2+Math.random()*3,a:1,col:`hsl(${18+Math.random()*35},100%,${48+Math.random()*22}%)`});ctx.clearRect(0,0,c.width,c.height);for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.x+=p.vx;p.y+=p.vy;p.a-=.022;p.r*=.975;if(p.a<=0){ps.splice(i,1);continue;}ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();}ctx.globalAlpha=1;},38);},
 le(b,c){clearInterval(b._ft);c.getContext('2d').clearRect(0,0,c.width,c.height);},
 x(b,c){const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2;ctx.clearRect(0,0,c.width,c.height);const ps=Array.from({length:35},()=>({x:cx,y:cy,vx:(Math.random()-.5)*6,vy:-(2+Math.random()*6),r:2+Math.random()*5,a:1,col:`hsl(${15+Math.random()*50},100%,${45+Math.random()*30}%)`}));let f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.a-=.014;if(p.a>0){alive=true;ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();}});ctx.globalAlpha=1;if(alive&&f++<80)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Pulso',desc:'respira con halo → onda se expande',
 l(b){let sc=1,dir=1;b._t=setInterval(()=>{sc+=dir*.009;if(sc>1.05||sc<.97)dir*=-1;b.style.transform=`scale(${sc})`;b.style.boxShadow=`0 0 ${(sc-1)*300}px ${(sc-1)*120}px rgba(61,90,254,.35)`;},28);},
 le(b){clearInterval(b._t);b.style.transform='';b.style.boxShadow='';},
 x(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2;let r=6,f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle=`rgba(61,90,254,${Math.max(0,1-f/50)})`;ctx.lineWidth=Math.max(.3,3-f*.055);ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();r+=9;if(f++<50)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Typewriter',desc:'texto se scramble → retipea letra a letra',
 l(b){const orig='Cargar turno';b._twO=orig;const chars='ABCDEFabcdef0123456789!@#$%';b._t=setInterval(()=>{b.textContent=Array.from(orig).map((ch,i)=>i<Math.random()*orig.length?chars[Math.floor(Math.random()*chars.length)]:ch).join('');},75);},
 le(b){clearInterval(b._t);b.textContent='Cargar turno';},
 x(b){const target='Turno cargado';b.textContent='';let i=0;const iv=setInterval(()=>{b.textContent=target.slice(0,i);if(i++>=target.length)clearInterval(iv);},45);}
},
{n:'Stars',desc:'estrellas orbitan → lluvia hacia arriba',
 l(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2,rad=Math.min(cx,cy)-5;const stars=Array.from({length:7},(_,i)=>({a:(i/7)*Math.PI*2,sz:2.5+Math.random()*2}));let t=0;b._st=setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{const x=cx+Math.cos(s.a+t)*rad,y=cy+Math.sin(s.a+t*.8)*rad*.55;ctx.fillStyle='rgba(253,224,71,.95)';ctx.beginPath();ctx.arc(x,y,s.sz,0,Math.PI*2);ctx.fill();});t+=.07;},28);},
 le(b,c){clearInterval(b._st);c.getContext('2d').clearRect(0,0,c.width,c.height);},
 x(b,c){const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2;ctx.clearRect(0,0,c.width,c.height);const ps=Array.from({length:22},(_,i)=>({x:cx,y:cy,vx:(Math.random()-.5)*3.5,vy:-(2+Math.random()*6),r:1.5+Math.random()*3,a:1}));let f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.a-=.013;if(p.a>0){alive=true;ctx.globalAlpha=p.a;ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}});ctx.globalAlpha=1;if(alive&&f++<80)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Shake',desc:'vibra horizontal → rebote + puntos',
 l(b){let t=0;b._t=setInterval(()=>{b.style.transform=`translateX(${Math.sin(t)*4}px)`;t+=.5;},16);},
 le(b){clearInterval(b._t);b.style.transform='';},
 x(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2;let b2=0,dir=1,f=0;const iv=setInterval(()=>{b2+=dir*2.5;if(Math.abs(b2)>12)dir*=-.75;b.style.transform=`scale(${1+Math.abs(b2)/100})`;if(f++>22){clearInterval(iv);b.style.transform='';}},16);const cols=['#22c55e','#fff','#6B7FFF','#facc15'];const ps=Array.from({length:22},(_,i)=>{const a=(i/22)*Math.PI*2;return{x:cx,y:cy,vx:Math.cos(a)*3,vy:Math.sin(a)*3,r:2+Math.random()*3,c:cols[i%cols.length],a:1};});let fr=0;(function d(){ctx.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.a-=.016;if(p.a>0){alive=true;ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();}});ctx.globalAlpha=1;if(alive&&fr++<65)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'DNA',desc:'dos puntos orbitan en elipse → explotan',
 l(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2,rad=Math.min(cx,cy)-5;let t=0;b._dt=setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);[[t,'#6B7FFF'],[t+Math.PI,'#f472b6']].forEach(([a,col])=>{const x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad*.5;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();});t+=.09;},28);},
 le(b,c){clearInterval(b._dt);c.getContext('2d').clearRect(0,0,c.width,c.height);},
 x(b,c){const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2;const ps=Array.from({length:24},(_,i)=>{const a=(i/24)*Math.PI*2,sp=2+Math.random()*3;return{x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3+Math.random()*4,c:i%2?'#6B7FFF':'#f472b6',a:1};});let f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.a-=.013;if(p.a>0){alive=true;ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();}});ctx.globalAlpha=1;if(alive&&f++<75)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Radar',desc:'scan tipo sonar → anillos concéntricos',
 l(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2,rad=Math.min(cx,cy)-3;let a=0;b._radt=setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.clip();if(ctx.createConicGradient){const g=ctx.createConicGradient(a,cx,cy);g.addColorStop(0,'rgba(61,90,254,.75)');g.addColorStop(.13,'rgba(61,90,254,0)');g.addColorStop(1,'rgba(61,90,254,0)');ctx.fillStyle=g;ctx.fillRect(cx-rad,cy-rad,rad*2,rad*2);}ctx.restore();ctx.strokeStyle='rgba(61,90,254,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();a+=.07;},28);},
 le(b,c){clearInterval(b._radt);c.getContext('2d').clearRect(0,0,c.width,c.height);},
 x(b,c){const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2;let r=6,f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle=`rgba(61,90,254,${Math.max(0,1-f/48)})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=`rgba(61,90,254,${Math.max(0,.5-f/96)})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,r*.55,0,Math.PI*2);ctx.stroke();r+=8;if(f++<48)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Confeti',desc:'papelitos caen → explosión de confeti',
 l(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const ps=[];const cols=['#6B7FFF','#f472b6','#facc15','#22c55e','#f87171'];b._ct=setInterval(()=>{for(let i=0;i<2;i++)ps.push({x:Math.random()*c.width,y:-5,vx:(Math.random()-.5)*2,vy:1+Math.random()*2,w:5+Math.random()*5,h:3+Math.random()*4,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.2,c:cols[Math.floor(Math.random()*cols.length)],a:1});ctx.clearRect(0,0,c.width,c.height);for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.a-=.008;if(p.a<=0||p.y>c.height){ps.splice(i,1);continue;}ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}},55);},
 le(b,c){clearInterval(b._ct);c.getContext('2d').clearRect(0,0,c.width,c.height);},
 x(b,c){const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2;const cols=['#6B7FFF','#f472b6','#facc15','#22c55e','#f87171','#34d399','#fff'];const ps=Array.from({length:40},()=>({x:cx,y:cy,vx:(Math.random()-.5)*9,vy:-(3+Math.random()*7),w:6+Math.random()*8,h:3+Math.random()*5,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],a:1}));let f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.rot+=p.vr;p.a-=.011;if(p.a>0){alive=true;ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}});if(alive&&f++<90)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Lightning',desc:'parpadeo eléctrico violeta → rayos',
 l(b){function fl(){b.style.boxShadow=`0 0 ${6+Math.random()*8}px 2px rgba(147,51,234,.85)`;b.style.filter=`brightness(${1.06+Math.random()*.12})`;b._t=setTimeout(fl,25+Math.random()*130);}fl();},
 le(b){clearTimeout(b._t);b.style.boxShadow='';b.style.filter='';},
 x(b,c){c.width=c.offsetWidth;c.height=c.offsetHeight;const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2,w=c.width,h=c.height;function bolt(x1,y1,x2,y2,rough,dep){if(dep===0){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();return;}const mx=(x1+x2)/2+(Math.random()-.5)*rough,my=(y1+y2)/2+(Math.random()-.5)*rough;bolt(x1,y1,mx,my,rough*.55,dep-1);bolt(mx,my,x2,y2,rough*.55,dep-1);}let f=0;(function d(){ctx.clearRect(0,0,c.width,c.height);if(f<11){ctx.strokeStyle=`rgba(167,139,250,${1-f*.08})`;ctx.lineWidth=Math.max(.3,2-f*.16);[[0,-1],[1,0],[0,1],[-1,0],[.7,-.7],[.7,.7],[-.7,.7],[-.7,-.7]].forEach(([dx,dy])=>bolt(cx,cy,cx+dx*(w*.48+f*5),cy+dy*(h*.48+f*5),14-f,3));}if(f++<13)requestAnimationFrame(d);else ctx.clearRect(0,0,c.width,c.height);})();}
},
{n:'Warp',desc:'distorsiona escala X/Y → implosión',
 l(b){let t=0;b._t=setInterval(()=>{b.style.transform=`scale(${1+Math.sin(t)*.033},${1+Math.cos(t*.8)*.028})`;t+=.14;},28);},
 le(b){clearInterval(b._t);b.style.transform='';},
 x(b){let f=0;const tot=30;(function d(){const p=f/tot;const sc=f<tot*.5?1-p*2*.27:.73+(p-.5)*2*.27;b.style.transform=`scale(${sc})`;b.style.filter=f<tot*.5?`blur(${p*5}px)`:`blur(${(1-p)*5}px)`;if(f++<tot)requestAnimationFrame(d);else{b.style.transform='';b.style.filter='';}})();}
}
];

const grid=document.getElementById('grid');
efectos.forEach((ef,idx)=>{
  const card=document.createElement('div');card.className='card';
  const label=document.createElement('div');label.className='card-label';
  label.innerHTML=`<span>${idx}</span>${ef.n}`;
  const stage=document.createElement('div');stage.className='stage';
  const cvs=document.createElement('canvas');
  cvs.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:5;width:100%;height:100%';
  const btn=document.createElement('button');btn.className='btn';
  btn.textContent='Cargar turno';
  stage.appendChild(cvs);stage.appendChild(btn);
  const desc=document.createElement('div');desc.className='card-desc';desc.textContent=ef.desc;
  card.appendChild(label);card.appendChild(stage);card.appendChild(desc);
  grid.appendChild(card);

  let running=false;
  card.addEventListener('click',()=>{
    if(running)return;running=true;
    btn.textContent='Cargar turno';btn.style.background='#3D5AFE';
    btn.style.transform='';btn.style.boxShadow='';btn.style.filter='';
    cvs.width=cvs.offsetWidth;cvs.height=cvs.offsetHeight;
    cvs.getContext('2d').clearRect(0,0,cvs.width,cvs.height);

    if(ef.n==='Typewriter')ef.l(btn);
    else ef.l(btn,cvs);

    setTimeout(()=>{
      if(ef.n==='Typewriter')ef.le(btn);
      else ef.le(btn,cvs);
      btn.style.background='#16a34a';
      if(ef.n==='Typewriter'||ef.n==='Warp'||ef.n==='Neon'||ef.n==='Glitch')ef.x(btn);
      else ef.x(btn,cvs);
      setTimeout(()=>{btn.style.background='#3D5AFE';running=false;},2000);
    },1800);
  });
});
</script>
